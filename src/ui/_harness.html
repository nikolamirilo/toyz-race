<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Toyz Race UI harness</title>
<!--
  UI test bench. Emulates the "stage" from index.html + src/core/stage.js:
    ?size=667x375   fixed stage size (default: fill the window)      ?touch=1  html.tr-touch
    ?rot=1          portrait "phone" with the stage rotated by 90deg  ?safe=L,R,B  fake safe-area insets (stage px)
    ?clean=1        hide the debug panels                            ?screen=car|track|...|hud|pause|results|lobby
  Same switches live in the panel on the right and in window.harness.set({ size, touch, rot }).
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;overscroll-behavior:none;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  /* #device = the emulated screen; #app = the stage, exactly like index.html */
  #device{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;background:#000}
  #device.fixed{outline:2px solid #f0f}
  #app{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;container-type:size;container-name:stage}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui-root{position:absolute;inset:0;pointer-events:none}
  #dbg{position:fixed;right:6px;top:6px;bottom:6px;z-index:99;display:flex;flex-direction:column;gap:3px;font:11px system-ui;opacity:.9;overflow:auto;max-width:150px;color:#fff}
  #dbg button,#dbg select{font:inherit;padding:2px 6px;cursor:pointer}
  #dbg b{margin-top:4px}
  #dbg.hide{display:none}
  #log{position:fixed;left:6px;bottom:6px;z-index:99;font:10px ui-monospace,monospace;color:#cfe;background:rgba(0,0,0,.55);padding:4px 6px;max-width:38vw;max-height:22vh;overflow:hidden;white-space:pre-wrap;pointer-events:none}
  #log.hide{display:none}
  #touchro{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:99;font:11px ui-monospace,monospace;color:#ffd02e;background:rgba(0,0,0,.7);padding:3px 8px;border-radius:4px;pointer-events:none;white-space:nowrap}
  #touchro.hide{display:none}
</style>
</head>
<body>
<div id="device"><div id="app"><canvas id="game"></canvas><div id="ui-root"></div></div></div>
<div id="dbg"></div>
<div id="log"></div>
<div id="touchro"></div>
<script type="module">
import { createUI } from './index.js';
import { createAudio, SOUND_NAMES } from '../audio/index.js';

// ---- mock data (harness only)
const TRACKS = [
  { id: 'desk', name: 'Homework Dash', description: 'A quick blast across a cluttered desk: pencils for kerbs and a ruler straight to finish.', difficulty: 1, defaultLaps: 3, lengthLabel: '520 m' },
  { id: 'garden', name: 'Flowerbed Loop', description: 'Bumpy soil, sweeping bends around flowerpots and a hose-pipe chicane.', difficulty: 2, defaultLaps: 3, lengthLabel: '680 m' },
  { id: 'kitchen', name: 'Counter Attack', description: 'Slippery worktops, a cereal-box tunnel and a daring jump over the sink.', difficulty: 3, defaultLaps: 4, lengthLabel: '740 m' },
  { id: 'attic', name: 'Attic Nightmare', description: 'Dusty beams, tight hairpins between old boxes and almost no room for mistakes.', difficulty: 4, defaultLaps: 5, lengthLabel: '880 m' },
];
const mkCar = (id, name, tagline, cls, color, s) => ({ id, name, tagline, class: cls, color, stats: { speed: s[0], accel: s[1], grip: s[2], weight: s[3] }, topSpeed: 28 + s[0] * 1.4 });
const CARS = [
  mkCar('pip', 'Pipsqueak', 'Small, eager and surprisingly sticky.', 'Rookie', '#ff6b1a', [4, 6, 8, 3]),
  mkCar('bolt', 'Dustbolt', 'A friendly buggy that forgives everything.', 'Rookie', '#19d3c5', [5, 5, 7, 5]),
  mkCar('brick', 'Brickhouse', 'Heavy. Slow. Immovable.', 'Rookie', '#8bc34a', [4, 4, 6, 10]),
  mkCar('zig', 'Zigzagger', 'Loves corners more than straights.', 'Amateur', '#ffd02e', [6, 7, 9, 4]),
  mkCar('howl', 'Night Howler', 'Long legs, lazy off the line.', 'Amateur', '#7c5cff', [8, 4, 6, 6]),
  mkCar('snap', 'Snapdragon', 'Twitchy rocket for brave thumbs.', 'Amateur', '#ff3d77', [7, 9, 5, 3]),
  mkCar('volt', 'Voltage', 'All the speed. None of the manners.', 'Pro', '#3aa0ff', [10, 8, 4, 5]),
  mkCar('apex', 'Apex Hornet', 'Razor sharp and razor thin margins.', 'Pro', '#f4f4f4', [9, 9, 7, 2]),
];
const ITEMS = [
  { id: 'turbo', name: 'Fizz Turbo', icon: '🚀', description: 'A shaken soda can. Massive burst of speed.' },
  { id: 'marble', name: 'Marble Shot', icon: '🔮', description: 'Fires a glass marble straight ahead.' },
  { id: 'glue', name: 'Glue Puddle', icon: '🫧', description: 'Drop a sticky puddle behind you.' },
  { id: 'magnet', name: 'Zap Magnet', icon: '🧲', description: 'Zaps the car in front and slows it down.' },
  { id: 'pop', name: 'Party Popper', icon: '🎉', description: 'Shockwave that shoves nearby cars away.' },
  { id: 'shield', name: 'Bubble Wrap', icon: '🛡️', description: 'Shrugs off the next hit.' },
];

// ---- fake "3D scene" backdrop
const cv = document.getElementById('game');
const g = cv.getContext('2d');
function paint(t) {
  const w = cv.clientWidth, h = cv.clientHeight; // stage size, not the window
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#6fb7e8'); gr.addColorStop(.55, '#cfe6c6'); gr.addColorStop(.56, '#7da35a'); gr.addColorStop(1, '#4b6b39');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#c9b48a';
  g.beginPath(); g.moveTo(w * .35, h); g.lineTo(w * .62, h * .56); g.lineTo(w * .72, h * .56); g.lineTo(w * .95, h); g.fill();
  g.fillStyle = '#e0483a'; g.fillRect(w * .66 + Math.sin(t / 700) * 30, h * .68, 120, 46);
  g.fillStyle = '#222'; g.beginPath(); g.arc(w * .66 + Math.sin(t / 700) * 30 + 25, h * .68 + 50, 16, 0, 7); g.arc(w * .66 + Math.sin(t / 700) * 30 + 95, h * .68 + 50, 16, 0, 7); g.fill();
}

// ---- wiring
const logEl = document.getElementById('log');
const lines = [];
const log = (...a) => { lines.push(a.map((x) => typeof x === 'string' ? x : JSON.stringify(x)).join(' ')); while (lines.length > 9) lines.shift(); logEl.textContent = lines.join('\n'); };
window.__log = lines;
const audio = createAudio();
window.audio = audio;
let lastMode = 'race';
const handlers = {
  onStart(cfg) { log('onStart', cfg); lastMode = cfg.mode; ui.hideMenu(); startRace(); },
  onPreview(p) { log('onPreview', p); },
  onResume() { log('onResume'); ui.hidePause(); paused = false; },
  onRestart() { log('onRestart'); ui.hidePause(); ui.hideResults(); startRace(); },
  onQuit() { log('onQuit'); if (mpRace) { mpRace = false; stopRoomSim(); } ui.hidePause(); ui.hideResults(); ui.hideHUD(); racing = false; audio.setEngine({ active: false }); audio.startMusic('menu'); ui.showMenu('main'); },
  onSettings(s) { log('onSettings', s); audio.setVolumes({ master: s.masterVolume, music: s.musicVolume, sfx: s.sfxVolume }); },
  onNextRace() { log('onNextRace'); ui.hideResults(); startRace(); },
  onUiSound(n) { audio.unlock(); audio.play(n); },
  // touch top-edge buttons
  onPauseRequest() { log('onPauseRequest'); if (!racing) return; if (mpRace) { ui.showPause({ multiplayer: true }); return; } paused = true; ui.showPause(); audio.setEngine({ active: false }); },
  onCameraRequest() { log('onCameraRequest'); ui.flashMessage('CAMERA: CHASE', 900); },
  onResetRequest() { log('onResetRequest'); ui.flashMessage('RESET', 700); },

  // ---- multiplayer (fake integrator + fake network)
  onMpHost(o) { log('onMpHost', o); fakeConnect(() => openLobby(true, 'KZQT', o)); },
  onMpJoin(o) {
    log('onMpJoin', o);
    fakeConnect(() => {
      if (o.code === 'FULL') return ui.showMpError('Room FULL is full (8 / 8 players).');
      if (o.code === 'LOCK') return ui.showMpError('That race has already started — try again when it is over.');
      if (o.code[0] === 'X') return ui.showMpError('No room with code ' + o.code + '. Check the code and try again.');
      openLobby(false, o.code, o);
    });
  },
  onMpCar(o) { log('onMpCar', o); const me = room.players.find((p) => p.isYou); if (me) me.carId = o.carId; ui.updateLobby({ players: room.players }); },
  onMpSettings(st) { log('onMpSettings', st); room.settings = st; setTimeout(() => ui.updateLobby({ settings: st }), 120); /* echo, like a relay would */ },
  onMpStart(st) { log('onMpStart', st); stopRoomSim(); mpRace = true; ui.hideMenu(); lastMode = 'race'; startRace(); },
  onMpLeave() { log('onMpLeave'); clearTimeout(connectT); stopRoomSim(); mpRace = false; },
  onMpLobby() { log('onMpLobby'); ui.hideResults(); ui.hideHUD(); racing = false; audio.setEngine({ active: false }); audio.startMusic('menu'); ui.showLobby(room); startRoomSim(); },
};
let mpRace = false, connectT = 0, simT = 0, pingT = 0;
const room = { code: '', joinUrls: [], isHost: true, players: [], settings: { trackId: 'garden', laps: 3, difficulty: 1, bots: 5 }, status: null };
const GUESTS = [['Rusty', 'howl'], ['Mo', 'zig'], ['Pixel', 'volt'], ['Juno', 'snap'], ['Biscuit', 'brick']];
function fakeConnect(fn) { clearTimeout(connectT); connectT = setTimeout(fn, 600); }
function openLobby(isHost, code, o) {
  room.code = code; room.isHost = isHost;
  room.joinUrls = ['http://192.168.1.20:5173/?join=' + code, location.origin + '/?join=' + code];
  const me = { id: 'me', name: o.playerName, carId: o.carId, isHost, isYou: true };
  room.players = isHost ? [me] : [{ id: 'h', name: 'Hostess', carId: 'apex', isHost: true, isYou: false }, me];
  room.status = 'Connected · ping 12 ms';
  ui.showLobby(room);
  startRoomSim();
}
function startRoomSim() {
  stopRoomSim();
  let n = 0;
  simT = setInterval(() => { // somebody joins or leaves every few seconds
    const others = room.players.filter((p) => !p.isYou && !p.isHost);
    if (others.length < 3 || Math.random() < .5) {
      const gst = GUESTS.find((x) => !room.players.some((p) => p.name === x[0]));
      if (gst) room.players.push({ id: 'g' + (n++), name: gst[0], carId: gst[1], isHost: false, isYou: false });
    } else room.players.splice(room.players.indexOf(others[0]), 1);
    ui.updateLobby({ players: room.players });
    log('sim: players -> ' + room.players.map((p) => p.name).join(', '));
  }, 2500);
  pingT = setInterval(() => ui.updateLobby({ status: 'Connected · ping ' + (8 + Math.floor(Math.random() * 30)) + ' ms' }), 1000);
  if (!room.isHost) setTimeout(() => { if (ui.isLobbyVisible()) ui.updateLobby({ settings: { trackId: 'attic', laps: 5 } }); }, 4000); // the "host" changes settings
}
function stopRoomSim() { clearInterval(simT); clearInterval(pingT); }
// ---- stage emulation (what src/core/stage.js does in the game)
const qs = new URLSearchParams(location.search);
const deviceEl = document.getElementById('device');
const appEl = document.getElementById('app');
const SIZES = ['fit', '568x320', '667x375', '844x390', '932x430', '1024x768', '1280x720'];
const stageCfg = { size: qs.get('size') || 'fit', touch: qs.get('touch') === '1', rot: qs.get('rot') === '1', safe: (qs.get('safe') || '').split(',').map(Number) };
function layoutStage() {
  const fit = stageCfg.size === 'fit';
  let [w, h] = fit ? [innerWidth, innerHeight] : stageCfg.size.split('x').map(Number);
  const root = document.documentElement;
  if (stageCfg.rot && fit) { w = innerHeight; h = innerWidth; } // portrait window, like a phone held upright
  deviceEl.classList.toggle('fixed', !fit);
  // the "screen": landscape w x h, or portrait h x w when rotated
  deviceEl.style.width = (stageCfg.rot ? h : w) + 'px';
  deviceEl.style.height = (stageCfg.rot ? w : h) + 'px';
  appEl.style.width = w + 'px';
  appEl.style.height = h + 'px';
  if (stageCfg.rot) {
    appEl.style.left = h + 'px';
    appEl.style.transformOrigin = '0 0';
    appEl.style.transform = 'rotate(90deg)';
  } else {
    appEl.style.left = '0px';
    appEl.style.transform = 'none';
  }
  root.classList.toggle('tr-touch', stageCfg.touch);
  root.classList.toggle('tr-rotated', stageCfg.rot);
  const base = document.querySelector('.tr-root');
  if (base) {
    const [l, r, b] = stageCfg.safe;
    ['--sal', '--sar', '--sab'].forEach((k, i) => { const v = [l, r, b][i]; if (v > 0) base.style.setProperty(k, v + 'px'); else base.style.removeProperty(k); });
  }
  window.dispatchEvent(new Event('tr-stage'));
}
addEventListener('resize', layoutStage);
layoutStage(); // before createUI, like initStage() in main.js

const ui = createUI(document.getElementById('ui-root'), { tracks: TRACKS, cars: CARS, items: ITEMS, handlers });
window.ui = ui;
layoutStage();
window.harness = { cfg: stageCfg, set(o) { Object.assign(stageCfg, o); layoutStage(); return stageCfg; } };
const s0 = ui.getSettings();
audio.setVolumes({ master: s0.masterVolume, music: s0.musicVolume, sfx: s0.sfxVolume });
audio.startMusic('menu');
addEventListener('pointerdown', () => audio.unlock());

// minimap: wobbly loop
const pts = [];
for (let i = 0; i < 120; i++) { const a = i / 120 * Math.PI * 2; const r = 90 + 35 * Math.sin(a * 3) + 20 * Math.cos(a * 2); pts.push([Math.cos(a) * r * 1.5, Math.sin(a) * r]); }
const at = (t) => { const f = ((t % 1) + 1) % 1 * 120; const i = Math.floor(f), k = f - i; const a = pts[i % 120], b = pts[(i + 1) % 120]; return { x: a[0] + (b[0] - a[0]) * k, z: a[1] + (b[1] - a[1]) * k }; };

let racing = false, paused = false, t0 = 0, raceT = 0, lastFrame = performance.now();
const carsDots = CARS.map((c, i) => ({ x: 0, z: 0, isPlayer: i === 0, color: c.color }));
function startRace() {
  racing = true; paused = false; raceT = -3.4; ui.showHUD(); audio.startMusic('race');
  let n = 3; counted = 4;
}
let counted = 0;
function frame(now) {
  now = performance.now(); const dt = Math.min(.5, (now - lastFrame) / 1000); lastFrame = now;
  paint(now);
  if (racing && !paused) {
    raceT += dt;
    const c = Math.ceil(-raceT);
    if (raceT < 0 && c < counted && c >= 1 && c <= 3) { counted = c; ui.showCountdown(String(c)); audio.play('count'); }
    if (raceT >= 0 && counted > 0) { counted = 0; ui.showCountdown('GO!'); audio.play('go'); }
    const T = Math.max(0, raceT);
    const lapLen = 14;
    const lap = Math.min(3, Math.floor(T / lapLen) + 1);
    const speed = raceT < 0 ? 0 : 24 + 14 * Math.sin(T * .9) + (T % 9 > 7 ? 10 : 0);
    carsDots.forEach((d, i) => { const p = at(T / lapLen + i * .04 - (i ? Math.sin(T * .3 + i) * .02 : 0)); d.x = p.x; d.z = p.z; });
    const itemIdx = Math.floor(T / 4) % (ITEMS.length + 1);
    ui.updateHUD({
      speed, topSpeed: 38, lap, laps: 3, position: lastMode === 'timetrial' ? 1 : 1 + (Math.floor(T / 3) % 8), total: lastMode === 'timetrial' ? 1 : 8,
      time: T, lapTime: T % lapLen, bestLap: T > lapLen ? 13.87 : null, lastLap: T > lapLen ? 14.02 : null,
      item: itemIdx < ITEMS.length ? ITEMS[itemIdx] : null, wrongWay: T % 11 > 9.2, boost: T % 9 > 7,
      minimap: { points: pts, cars: carsDots },
    });
    audio.setEngine({ rpm: Math.min(1, speed / 42), throttle: raceT < 0 ? 0 : .8, active: true });
    audio.setSkid(T % 6 > 5 ? .7 : 0);
  } else if (!racing) audio.setSkid(0);
}
setInterval(frame, 16);
// live readout of ui.touch
const touchRo = document.getElementById('touchro');
let roLast = '';
setInterval(() => {
  const t = ui.touch;
  const str = 'ui.touch ' + JSON.stringify(t) + '  autoGas=' + ui.getSettings().autoGas + '  stage=' + appEl.clientWidth + 'x' + appEl.clientHeight;
  if (str !== roLast) { roLast = str; touchRo.textContent = str; }
}, 50);

// integrator-style keys: must only fire when the UI is not capturing
addEventListener('keydown', (e) => {
  log('game key: ' + e.key);
  if ((e.key === 'Escape' || e.key === 'p') && racing) {
    if (mpRace) { ui.showPause({ multiplayer: true }); return; } // the race keeps running
    paused = !paused; if (paused) { ui.showPause(); audio.setEngine({ active: false }); } else ui.hidePause();
  }
  if (e.key === 'm') { audio.setMuted(!audio.isMuted()); }
});

const names = ['Player', 'Rusty', 'Mo', 'Pixel', 'Juno', 'Biscuit', 'Tank', 'Nova'];
const standings = (playerPos = 2) => {
  const order = names.slice(1); order.splice(playerPos - 1, 0, 'Player');
  return order.map((n, i) => ({ name: n === 'Player' ? ui.getSettings().playerName : n, carName: CARS[i].name, position: i + 1, finished: i < 7, finishTime: i < 7 ? 131.42 + i * 2.37 : null, bestLap: 41.2 + i * .61, isPlayer: n === 'Player' }));
};
const champTable = (final) => names.map((n, i) => ({ name: n, points: (final ? 36 : 10) - i * (final ? 4 : 1) + (i === 0 ? 0 : 0), isPlayer: i === 0 })).sort(() => .5 - Math.random());
window.demo = {
  results: () => ui.showResults({ standings: standings(2), mode: 'race', trackName: TRACKS[1].name, newRecord: true, championship: null }),
  resultsWin: () => ui.showResults({ standings: standings(1), mode: 'race', trackName: TRACKS[0].name, newRecord: false, championship: null }),
  resultsTT: () => ui.showResults({ standings: standings(1).slice(0, 1), mode: 'timetrial', trackName: TRACKS[2].name, newRecord: true, championship: null }),
  resultsChamp: () => ui.showResults({ standings: standings(3), mode: 'championship', trackName: TRACKS[1].name, newRecord: false, championship: { round: 2, rounds: 4, table: champTable(false), final: false } }),
  resultsFinal: () => ui.showResults({ standings: standings(1), mode: 'championship', trackName: TRACKS[3].name, newRecord: true, championship: { round: 4, rounds: 4, table: champTable(true), final: true } }),
  race: () => { ui.hideMenu(); ui.hideResults(); startRace(); },
  resultsMp: (isHost = true) => { mpRace = true; stopRoomSim(); ui.hideMenu(); ui.showResults({ standings: standings(2).map((x, i) => Object.assign(x, { isHuman: x.isPlayer || i === 0 || i === 4 })), mode: 'race', trackName: TRACKS[1].name, newRecord: false, championship: null, multiplayer: { isHost } }); },
  lobby: (isHost = true) => { ui.hideHUD(); racing = false; openLobby(isHost, 'KZQT', { playerName: ui.getSettings().playerName, carId: ui.getSelection().carId }); },
  room,
  startRace, stop: () => { racing = false; },
};

const dbg = document.getElementById('dbg');
const H = (label) => { const b = document.createElement('b'); b.textContent = label; dbg.appendChild(b); };
H('stage');
const selSize = document.createElement('select'); SIZES.forEach((n) => { const o = document.createElement('option'); o.textContent = n; selSize.appendChild(o); }); selSize.value = stageCfg.size; dbg.appendChild(selSize);
selSize.onchange = () => harness.set({ size: selSize.value });
const B = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => { audio.unlock(); fn(); b.blur(); }; dbg.appendChild(b); };
B('toggle tr-touch', () => harness.set({ touch: !stageCfg.touch }));
B('toggle rotated', () => harness.set({ rot: !stageCfg.rot }));
B('toggle safe-area', () => harness.set({ safe: stageCfg.safe[0] > 0 ? [] : [47, 47, 21] }));
H('screens');
['title', 'main', 'car', 'track', 'options', 'controls'].forEach((s) => B('menu:' + s, () => { racing = false; ui.hideHUD(); ui.hideResults(); ui.hidePause(); ui.showMenu(s); }));
B('hide menu', () => ui.hideMenu());
B('race + HUD', () => demo.race());
B('pause', () => { paused = true; ui.showPause(); });
B('flash', () => ui.flashMessage('FINAL LAP', 1800));
B('flash long', () => ui.flashMessage('NEW LAP RECORD  0:42.31', 2500));
B('countdown', () => { ui.showCountdown('3'); setTimeout(() => ui.showCountdown('GO!'), 1100); });
B('results', () => demo.results());
B('results TT', () => demo.resultsTT());
B('results champ', () => demo.resultsChamp());
B('results final', () => demo.resultsFinal());
B('menu:mp', () => { racing = false; ui.hideHUD(); ui.hideResults(); ui.hidePause(); ui.showMenu('mp'); });
B('mp ?join=ABCD', () => { racing = false; ui.hideHUD(); ui.showMenu('mp', { joinCode: 'abcd' }); });
B('lobby host', () => demo.lobby(true));
B('lobby guest', () => demo.lobby(false));
B('mp error', () => { stopRoomSim(); ui.showMpError('Connection lost — the host closed the room.'); });
B('mp race', () => { mpRace = true; demo.race(); });
B('pause mp', () => ui.showPause({ multiplayer: true }));
B('results mp', () => demo.resultsMp(true));
B('music menu', () => audio.startMusic('menu'));
B('music race', () => audio.startMusic('race'));
B('music stop', () => audio.stopMusic());
const selS = document.createElement('select'); SOUND_NAMES.forEach((n) => { const o = document.createElement('option'); o.textContent = n; selS.appendChild(o); }); dbg.appendChild(selS);
B('play sfx', () => audio.play(selS.value));
if (qs.has('clean')) { dbg.className = 'hide'; logEl.className = 'hide'; touchRo.className = 'hide'; }

// ?screen=... jumps straight to one screen (handy for screenshots)
const go = {
  hud: () => demo.race(), pause: () => { demo.race(); paused = true; ui.showPause(); }, results: () => demo.results(), resultsChamp: () => demo.resultsChamp(), resultsFinal: () => demo.resultsFinal(),
  resultsMp: () => demo.resultsMp(true), lobby: () => demo.lobby(true), lobbyGuest: () => demo.lobby(false),
};
window.show = (name) => { racing = false; paused = false; mpRace = false; stopRoomSim(); ui.hideHUD(); ui.hideResults(); ui.hidePause(); if (go[name]) { ui.hideMenu(); go[name](); } else ui.showMenu(name); };
show(qs.get('screen') || 'title');
</script>
</body>
</html>
